server {
    listen 80;
    
    # Phục vụ file tĩnh
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Hỗ trợ React Router DOM: Bắt mọi URL trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # Báo lỗi 50x
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
