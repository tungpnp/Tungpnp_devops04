# ==============================================================================
# File: k8s-manifests/argocd-apps/network.yaml
# Mục đích: ArgoCD Application quản lý Traefik Ingress Rules (*.tungpnp.org.uk)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-network
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/tungpnp/devops04-trading-platform.git
    targetRevision: HEAD
    path: k8s-manifests/network
    directory:
      exclude: "*.example.yaml" # Loại trừ mẫu cloudflared Secret/Token khỏi sync tự động
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
