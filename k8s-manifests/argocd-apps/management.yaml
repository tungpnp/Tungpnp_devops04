# ==============================================================================
# File: k8s-manifests/argocd-apps/management.yaml
# Mục đích: ArgoCD Application quản lý Cấu hình Quản trị (ArgoCD Ingress trong namespace argocd)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/tungpnp/devops04-trading-platform.git
    targetRevision: HEAD
    path: k8s-manifests/management
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
