# ==============================================================================
# File: k8s-manifests/management/argocd-ingress.yaml
# Mục đích: Mở cửa Web UI của ArgoCD qua Traefik Ingress (argocd.tungpnp.org.uk & argocd.tungpnp.local)
# Lưu ý quan trọng: Pod argocd-server cần chạy cờ '--insecure' (hoặc ConfigMap
#                   argocd-cmd-params-cm có server.insecure: "true") để tránh lỗi
#                   HTTP 307 Redirect Loop phía sau Traefik HTTP Reverse Proxy.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.tungpnp.org.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
    - host: argocd.tungpnp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
