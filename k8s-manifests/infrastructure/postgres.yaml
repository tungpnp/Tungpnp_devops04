# ==============================================================================
# File: k8s-manifests/infrastructure/postgres.yaml
# Mục đích: Triển khai PostgreSQL 15 + Sidecar Postgres Exporter trên cụm Floci K3s
# Bảo mật: Toàn bộ thông tin đăng nhập lấy từ Kubernetes Secret 'trading-cloud-secrets'
#          (được đồng bộ tự động từ AWS Secrets Manager của Floci, KHÔNG hardcode)
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    matchLabels:
      app: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        coreback: "true" # Phân vùng Hard-Tenancy: chạy trên node có nhãn coreback=true
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            # Nạp thông tin đăng nhập an toàn từ K8s Secret (đồng bộ từ Floci Secrets Manager)
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trading-cloud-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-cloud-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: trading-cloud-secrets
                  key: POSTGRES_DB
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
        # Sidecar Pattern: Hút metrics nội bộ PostgreSQL ra cổng 9187 cho Prometheus
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: trading-cloud-secrets
                  key: DATA_SOURCE_NAME
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: default
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30032
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
  type: NodePort
