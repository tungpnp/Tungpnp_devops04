# ==============================================================================
# File: k8s-manifests/infrastructure/secrets.example.yaml
# Mục đích: File mẫu cấu trúc Kubernetes Secret cho hệ thống Trading Microservices
# Lưu ý bảo mật: Đây chỉ là file MẪU (Placeholder). Khi triển khai thực tế trên Floci K3s,
# chạy script utilities/sync_floci_to_k3s.ps1 để tự động lấy bí mật từ AWS Secrets Manager
# & SSM Parameter Store trên Floci bơm trực tiếp vào Secret tên 'trading-cloud-secrets'.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: trading-cloud-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_USER: "CHANGE_ME_DB_USER"
  POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  POSTGRES_DB: "userdb"
  DATA_SOURCE_NAME: "postgresql://CHANGE_ME_DB_USER:CHANGE_ME_DB_PASSWORD@localhost:5432/userdb?sslmode=disable"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_MIN_32_CHARS"
  # Tuỳ chọn seed tài khoản demo khi chạy bài thuyết trình (mặc định false trong Production)
  APP_DEMO_SEED_ENABLED: "false"
  APP_DEMO_USERNAME: "CHANGE_ME_DEMO_USER"
  APP_DEMO_PASSWORD: "CHANGE_ME_DEMO_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: default
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_GRAFANA_PASSWORD"
