# ==============================================================================
# File: k8s-manifests/network/cloudflared-tunnel.example.yaml
# Mục đích: Mẫu Deployment chạy Cloudflare Tunnel Daemon trực tiếp bên trong cụm K3s
# Bảo mật: File mẫu KHÔNG chứa Tunnel Token thật. Khi deploy, tạo Secret 'cloudflared-secret'
#          hoặc chạy script utilities/start_cloudflare_tunnel.ps1 trên máy host.
# Lưu lượng Public (*.tungpnp.org.uk) -> Cloudflare Edge -> cloudflared -> Traefik Service (:80)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secret
  namespace: default
type: Opaque
stringData:
  # Thay thế bằng Tunnel Token lấy từ Cloudflare Zero Trust Dashboard (KHÔNG commit token thật lên Git)
  TUNNEL_TOKEN: "<YOUR_CLOUDFLARE_TUNNEL_TOKEN>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: default
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-secret
                  key: TUNNEL_TOKEN
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
