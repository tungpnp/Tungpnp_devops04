# ==============================================================================
# File: k8s-manifests/network/ingress.yaml
# Mục đích: Định tuyến lưu lượng HTTP/HTTPS thông qua Traefik Ingress Controller (L7 Routing)
# Domain thật (Cloudflare Tunnel): trading.tungpnp.org.uk, grafana.tungpnp.org.uk, kibana.tungpnp.org.uk
# Domain cục bộ (On-Prem / Floci): tungpnp.local, grafana.tungpnp.local, kibana.tungpnp.local
# AWS Production Parity: Tương đương AWS Application Load Balancer (ALB) + Host/Path Listener Rules
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-main-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    # 1. Domain Public qua Cloudflare Tunnel: Web Trading App & APIs
    - host: trading.tungpnp.org.uk
      http:
        paths:
          # Đường dẫn /api/python điều hướng thẳng sang FastAPI Python Service
          - path: /api/python
            pathType: Prefix
            backend:
              service:
                name: backend-python-service
                port:
                  number: 8000
          # Đường dẫn /api đi qua Node.js API Gateway (Rate Limit, OTel, Metrics) -> Java Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 3001
          # Mọi đường dẫn giao diện còn lại trỏ về React Frontend Nginx
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-react-service
                port:
                  number: 80

    # 2. Domain Local đồng bộ giữa On-Premise K3s và Floci K3s (cổng 80)
    - host: tungpnp.local
      http:
        paths:
          - path: /api/python
            pathType: Prefix
            backend:
              service:
                name: backend-python-service
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-react-service
                port:
                  number: 80

    # 3. Grafana Dashboard (Metrics + Tempo Traces)
    - host: grafana.tungpnp.org.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
    - host: grafana.tungpnp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000

    # 4. Kibana ELK Logs Dashboard
    - host: kibana.tungpnp.org.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-service
                port:
                  number: 5601
    - host: kibana.tungpnp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-service
                port:
                  number: 5601
