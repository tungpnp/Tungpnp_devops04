# ==============================================================================
# File: .github/workflows/ci-backend.yml
# Mục đích: Pipeline CI/CD GitOps cho Core Backend Java (Spring Boot)
# Luồng xử lý: Build Maven -> Đóng gói Docker -> Push lên GHCR -> Cập nhật Manifest kích hoạt ArgoCD
# ==============================================================================
name: CI Backend Java

on:
  push:
    branches: [ "main", "uat" ]
    paths:
      - 'source/backend-java/**'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write # Tự động cấp quyền ghi Image vào GHCR qua GITHUB_TOKEN

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Package with Maven
        working-directory: ./source/backend-java
        run: mvn clean package -DskipTests

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/backend-java"
          VERSION="v1.0.${{ github.run_number }}"
          echo "IMAGE_TAG=${IMAGE_NAME}:${VERSION}" >> $GITHUB_ENV
          docker build -t ${IMAGE_NAME}:${VERSION} ./source/backend-java
          docker push ${IMAGE_NAME}:${VERSION}

      - name: Update Kubernetes Manifest for ArgoCD Sync
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions GitOps Bot"

          if [ -n "$PAT_TOKEN" ]; then
            # Chế độ Dual-Repo GitOps: Cập nhật sang kho Manifest độc lập
            git clone https://${{ github.repository_owner }}:${PAT_TOKEN}@github.com/${{ github.repository_owner }}/k3s-manifest-repo-ci-cd.git manifest-repo
            cd manifest-repo
            sed -i "s|image: ghcr.io/.*/backend-java:.*|image: ${IMAGE_TAG}|g" apps/backend.yaml
            git add apps/backend.yaml
            git commit -m "chore(gitops): auto update backend-java tag [skip ci]"
            git push origin HEAD
          else
            # Chế độ Monorepo GitOps: Cập nhật trực tiếp k8s-manifests/apps/backend.yaml
            sed -i "s|image: ghcr.io/.*/backend-java:.*|image: ${IMAGE_TAG}|g" k8s-manifests/apps/backend.yaml
            git add k8s-manifests/apps/backend.yaml
            git commit -m "chore(gitops): auto update backend-java tag [skip ci]" || exit 0
            git push
          fi
